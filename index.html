<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>글자수 세기</title>
<style>
  body { font-family: sans-serif; max-width: 600px; margin: 40px auto; padding: 0 16px; }
  textarea { width: 100%; height: 180px; padding: 8px; font-size: 16px; box-sizing: border-box; }
  button { margin-top: 8px; padding: 8px 20px; font-size: 16px; cursor: pointer; }
  #result { margin-top: 16px; font-size: 18px; line-height: 1.7; }
</style>
</head>
<body>
  <h1>글자수 세기</h1>
  <textarea id="input" placeholder="여기에 글을 입력하세요"></textarea>
  <br>
  <button id="btn">글자수 세기</button>
  <div id="result"></div>

  <script>
    document.getElementById('btn').addEventListener('click', function () {
      var text = document.getElementById('input').value;
      var withSpace = Array.from(text).length;
      var withoutSpace = Array.from(text.replace(/\s/g, '')).length;
      document.getElementById('result').innerHTML =
        '공백 포함: <b>' + withSpace + '</b>자<br>' +
        '공백 제외: <b>' + withoutSpace + '</b>자';
    });
  </script>
</body>
</html>
